# ===========================================================================
# Tulpar Engine — CI
#
# Kural (projenin kendi kurali): KOSMAYAN KAPI YESIL DEGILDIR.
# engine_tests donanim/arac yoksa sessizce gecmez, "ATLANDI: <sebep>" basar ve
# ozet satirindaki sayaca girer. Bu yuzden is akisi ozet satirini PARSE eder:
#   - ozet satiri hic yoksa   -> KIRMIZI (cokme/asilma "0 failed" gibi okunamaz)
#   - kosan != kayitli        -> KIRMIZI (kayit tasmasi: test hic kosmamis olur)
#   - failed > 0              -> KIRMIZI
#   - atlanan kapilarin sebepleri is ozetine YAZILIR (gorunmeden kalmasin)
# Ubuntu'da lavapipe, macOS'ta MoltenVK kurulur, yani Vulkan yolunun gercekten
# kosmasi BEKLENIR: "Vulkan ... yok" gerekceli tek bir atlama bile isi kirmiziya
# cevirir. AYNI SEY DOGRULAMA KATMANI ICIN DE GECERLI: iki ayakta da
# vulkan-validationlayers KURULU ve loader duzeyinde (vulkaninfo) dogrulaniyor,
# bu yuzden "VK_LAYER_KHRONOS_validation yok" gerekceli tek bir atlama da isi
# KIRMIZI yapar — o satir basildiginda dev.validation_errors()==0 isteyen bes
# kapi (rhi_validation_layer_reports_zero_errors, renderer_/render_graph_post_/
# render_graph_gpu_cull_/temporal_ Mali kapilari) HIC kosmamistir.
# Windows'ta da (2026-10-05'ten beri) ICD var: runner'daki Chrome'un
# SwiftShader'i + MSYS2 dogrulama katmani, kayit defterinden
# (tools/windows_vulkan_icd.sh). Ayni kural: Vulkan / katman atlamasi KIRMIZI.
# MSYS2 mesa lavapipe DENENDI ve ELENDI (bellek birakirken yigini bozuyor,
# Tuzaklar 8cr). release.yml'in Windows isinde ICD hala kurulmuyor.
# `continue-on-error` YOK; hicbir adim yumusatilmaz.
#
# UC PLATFORM, IKI MIMARI: linux/windows x86_64, macos arm64. macOS ayagi bir
# "ayni seyi bir kez daha kosturma" degil — fiber gecisi MIMARIYE OZEL elle
# yazilmis assembly (core/jobs/fiber_switch_{x86_64,aarch64}.S) ve AArch64 dali
# yalniz burada kosuyor. O is olmadan is sisteminin yarisi CI'da olculmuyordu.
# ===========================================================================
name: CI

# =====================================================================
# NE ZAMAN KOSAR — TulparLang (build.yml) ile AYNI model (2026-09-21):
#   * main/master/develop'a push  -> derle + test + paketle; main'de PR'in
#     artefakti yeniden kullanilir (asagida "yeniden kullan" adimi).
#   * main/master'a acilan PR      -> derle + test + paketle (uc platform).
#     Baska bir dala acilan PR CI ALMAZ (TulparLang'de de almaz); katmanli
#     PR'larin ust katmani ancak main'e dondugunde olculur.
#   * `v*` etiketi                 -> BURADA DEGIL, release.yml (ayni uc is
#     + paketleme + yayin). TulparLang bunu build.yml icinde yapar; burada
#     ayri dosya, davranis ayni: surum yalniz etikette, main push'ta degil.
#   * workflow_dispatch            -> elle prova.
# NE ZAMAN MAIN'E GIRER: auto-merge.yml her taslak-olmayan PR'da squash
# auto-merge'u acar; main'in dal korumasi bu dosyadaki UC isi (adiyla)
# zorunlu sayar ve `strict` (dal guncel olmali). Ucu yesil -> squash.
# DOCS-ONLY: yalniz README/docs degisen bir PR'da isler yine KOSAR (zorunlu
# check adi yesil raporlasin diye) ama her adim atlanir.
# =====================================================================
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  # `actions: read` — main push'undaki "yeniden kullan" adimi PR kosumunun
  # artefaktini listeleyip indirir.
  actions: read

# Derleyici onbellegi (ccache) UC ISTE DE acik. Gerekce olculdu (2026-09-20):
# 402 derleme biriminin 202'si (%50,2) vendored ve HIC DEGISMIYOR — Jolt 133,
# astcenc 22, meshoptimizer 20, Recast/Detour 18, ImGui 7, cgltf/stb/miniaudio 2.
# Onbelleksizken her kosum bunlari sifirdan derliyordu. Onbellek is alani
# ICINDE tutuluyor (checkout'tan SONRA geri yukleniyor; checkout clean:true
# oldugu icin once yuklenirse silinirdi).
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPRESS: "1"
  # Derleyici ikilisinin ICERIGINE gore anahtarla: runner imaji gcc'yi ayni
  # surum numarasiyla degistirirse mtime tabanli kontrol yanlis isabet verirdi.
  CCACHE_COMPILERCHECK: content

# Ayni ref'e ust uste push: eski kosum iptal. main HARIC — main'deki kosum
# PR artefaktini yeniden kullanan yol; yarida iptal edilirse main'in HEAD'i
# icin hic sonuc kalmaz (TulparLang'deki ayni istisna).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Yalniz belge degisen bir PR (README, docs/*.md) ikiliyi degistiremez;
  # uc platformda tam derleme bosa gider. Bayrak burada BIR KEZ hesaplanir,
  # uc is `needs` ile alir ve her adimini bayraga gore atlar. Isler yine
  # KOSAR: dal korumasi zorunlu check'i ADIYLA bekler ve "skipped" bir isi
  # "success" saymaz (TulparLang PR #142'de olculdu) — butun adimlari
  # atlanan is yesil raporlar.
  detect-docs-only:
    name: Belge-degisikligi tespiti
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: docs_only bayragi
        id: detect
        shell: bash
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "Ust commit yok — tam derleme."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^..HEAD)
          echo "HEAD^..HEAD degisen dosyalar:"
          printf '  %s\n' $changed
          # Ikiliyi HICBIR SEKILDE etkileyemeyecek yollar. Liste dar tutuldu:
          # tools/*.md dahil degil (arac belgeleri paketlenen dosya olabilir).
          non_docs=$(echo "$changed" | grep -vE '^(README\.md|docs/[^/]+\.md|tulpar/README\.md)$' || true)
          if [ -n "$changed" ] && [ -z "$non_docs" ]; then
            echo "Yalniz belge degismis — derleme adimlari atlanacak."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kod degismis — tam derleme."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux x86_64 (GCC + lavapipe)
    needs: detect-docs-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-docs-only.outputs.docs_only != 'true'

      # main'e squash-merge ile gelen commit'in PR'i zaten yesil kostu; ayni
      # agaci uc platformda yeniden derlemek bosa 15-25 dk. PR kosumunun
      # artefakti (dagitim/) indirilir ve asagidaki "Ciktilari yukle" adimi
      # onu aynen yeniden yukler; derleme/test/paketleme adimlari atlanir.
      # Arama basarisizsa sifirdan derlenir (en kotu durumda davranis eski).
      # DOGRULUGU main'in `strict` dal korumasina bagli (TulparLang
      # auto-merge.yml basligindaki zincir): dal main'i iceriyorsa squash
      # sonrasi main'in agaci PR'in agacina esittir.
      - name: PR artefaktini yeniden kullanmayi dene
        id: reuse
        if: needs.detect-docs-only.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTEFAKT: motor-linux-x86_64
        run: |
          set -e
          pr_num=$(git log -1 --format='%s' | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          if [ -z "$pr_num" ]; then
            echo "Commit basliginda PR numarasi yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head_sha=$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ -z "$head_sha" ]; then
            echo "PR #$pr_num okunamadi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          run_id=$(gh run list --workflow='CI' --status=success --limit=30 \
                     --json databaseId,headSha \
                     --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" | head -1)
          if [ -z "$run_id" ]; then
            echo "PR #$pr_num head $head_sha icin yesil CI kosumu yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "PR #$pr_num kosumu $run_id artefakti ($ARTEFAKT) yeniden kullaniliyor"
          set +e
          rm -rf dagitim && mkdir -p dagitim
          if ! gh run download "$run_id" -n "$ARTEFAKT" -D dagitim; then
            echo "Artefakt indirilemedi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$(ls -A dagitim)" ]; then
            echo "Artefakt bos — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ls -la dagitim
          echo "reused=true" >> "$GITHUB_OUTPUT"

      # mesa-vulkan-drivers = lavapipe ICD (yazilim Vulkan). libvulkan1 = loader;
      # motor onu link zamaninda degil dlopen ile ariyor, yani paket yoksa butun
      # GPU kapilari atlanir ve "passed" sayisi GPU hakkinda hicbir sey soylemez.
      - name: Bagimliliklar (lavapipe dahil)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ python3 ccache libvulkan1 mesa-vulkan-drivers vulkan-tools \
            vulkan-validationlayers libglfw3 clang libssl-dev

      - name: ccache onbellegi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      # Surucu VE dogrulama katmani: ikisi de LOADER duzeyinde goruluyor mu?
      # "Paket kurulu" YETMEZ — manifest loader'in aramadigi bir dizindeyse ya da
      # kitaplik acilmiyorsa loader katmani LISTELEMEZ; motor "katman yok" der ve
      # dev.validation_errors()==0 isteyen BES kapi sessizce atlanir.
      # Tam olarak bu oluyordu: apt listesinde vulkan-validationlayers HIC YOKTU,
      # her kosumda 5 atlama basiliyordu ve is yine de YESIL geciyordu.
      - name: Vulkan surucusu + dogrulama katmani gercekten var mi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          vulkaninfo --summary 2>&1 | tee vulkaninfo.log
          # Iki ayri ariza, iki ayri mesaj: "vulkaninfo katman listesini hic
          # basamadi" (loader/ICD sorunu) ile "bastı ama katman icinde yok"
          # (manifest/yol sorunu) ayni hata metnine sigmaz — biri otekinin
          # teshisini gizler.
          if ! grep -q 'Instance Layers' vulkaninfo.log; then
            echo "::error::vulkaninfo katman listesini HIC basamadi — loader instance kuramiyor. Katman kapilari degil, Vulkan yolunun kendisi bozuk."
            tail -30 vulkaninfo.log || true
            exit 1
          fi
          if ! grep -q 'VK_LAYER_KHRONOS_validation' vulkaninfo.log; then
            echo "::error::VK_LAYER_KHRONOS_validation loader'in katman listesinde YOK — paket kurulu olsa bile dogrulama/Mali kapilari olcmeden atlanirdi."
            echo "manifest gercekte nerede:"
            ls -la /usr/share/vulkan/explicit_layer.d/ 2>&1 || true
            dpkg -L vulkan-validationlayers 2>/dev/null | grep -E '\.json$|\.so' || true
            echo "loader teshisi:"
            VK_LOADER_DEBUG=warn vulkaninfo --summary 2>&1 | tail -40 || true
            exit 1
          fi
          grep 'VK_LAYER_KHRONOS_validation' vulkaninfo.log

      # Katman kurali mekaniktir: ihlal = derleme hatasi (engine_core'un on kosulu).
      # Derlemeden once ayrica acikca kosuyoruz ki mesaj derleyici ciktisinda kaybolmasin.
      # derle.sh'in bagimlilik denetimini GERCEK apt uzerinde olcer.
      # Neden onemli: kutuphane arama kodu yerelde (pacman) dogru gorunup
      # baska bir dagitimda yanlis olcebiliyor — nitekim ilk surumu tam
      # oyle bir hatayla cikti (tek `ls`e cok yol verilince KURULU
      # kutuphaneler "eksik" gorunuyordu). --sadece-denetle kurmaz, derlemez.
      - name: derle.sh bagimlilik denetimi (apt)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: ./derle.sh --sadece-denetle

      - name: Katman denetimi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: cmake --build yapi -j"$(nproc)"

      # Isabet orani GORUNUR olsun: dusen bir oran "onbellek calisiyor sandim"
      # diye sessizce gecmesin (yavaslamanin sebebi burada okunur).
      - name: ccache isabet orani
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Kapinin POZITIF KONTROLU: Vulkan'i kapatip atlama satirlarinin GERCEKTEN
      # basildigini goruyoruz. Boylece asagidaki Vulkan kontrolunun hicbir seye
      # uymayan bos bir grep olmadigi kanitlanmis oluyor.
      - name: Atlama mekanizmasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          TULPAR_ENGINE_NO_VULKAN=1 ./yapi/engine_tests rhi_ > kontrol.log 2>&1 || true
          # Asagidaki kapiyla AYNI ifade — kontrol ettigi sey de tam olarak o.
          n=$(grep -E 'ATLANDI:.*Vulkan' kontrol.log | grep -cv 'tukendi')
          if [ "$n" -eq 0 ]; then
            echo "::error::Pozitif kontrol basarisiz: TULPAR_ENGINE_NO_VULKAN=1 ile bile Vulkan atlama satiri basilmadi. Asagidaki Vulkan kapisi bos bir grep olurdu."
            tail -40 kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: $n atlama satiri uretildi."

      # IKINCI POZITIF KONTROL — bu sefer DOGRULAMA KATMANI kapisi icin.
      # Katmani BILEREK gizliyoruz (VK_LAYER_PATH + VK_ADD_LAYER_PATH bos bir
      # dizine; loader'a "explicit katmanlari yalniz burada ara" demektir) ve
      # bes kapinin atlama satirini GERCEKTEN bastigini goruyoruz. Boylece
      # asagidaki katman kapisinin hicbir seye uymayan bos bir grep olmadigi
      # kanitlanir. Iki suzgec besini de kapsar (ad ALT DIZGI ile eslenir):
      #   validation_layer  -> rhi_validation_layer_reports_zero_errors
      #   mali_best_practices -> renderer_/render_graph_post_/render_graph_gpu_cull_/temporal_
      - name: Dogrulama katmani atlamasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          # NOT: BSD mktemp (macOS) sablonsuz `mktemp -d` KABUL ETMEZ — bos bir
          # $bos, VK_LAYER_PATH="" demek olurdu ve kontrol sessizce anlamini
          # yitirirdi. Dizini kendimiz yaratiyoruz: her iki ayakta da ayni.
          bos="${RUNNER_TEMP:-$PWD}/bos_katman_dizini"
          rm -rf "$bos"; mkdir -p "$bos"
          VK_LAYER_PATH="$bos" VK_ADD_LAYER_PATH="$bos" ./yapi/engine_tests mali_best_practices  > katman_kontrol.log 2>&1 || true
          VK_LAYER_PATH="$bos" VK_ADD_LAYER_PATH="$bos" ./yapi/engine_tests validation_layer     >> katman_kontrol.log 2>&1 || true
          # Asagidaki kapiyla AYNI ifade — kontrol ettigi sey de tam olarak o.
          n=$(grep -cE 'ATLANDI:.*VK_LAYER_KHRONOS_validation' katman_kontrol.log || true)
          if [ "$n" -lt 5 ]; then
            echo "::error::Pozitif kontrol basarisiz: katman GIZLIYKEN beklenen 5 atlama satirindan yalnizca $n basildi. Asagidaki katman kapisi bos bir grep olurdu. (Kapi eklendi/silindiyse bu sayiyi guncelle.)"
            tail -60 katman_kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: katman gizliyken $n atlama satiri uretildi (bes kapi)."

      - name: Testler + kapi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          ./yapi/engine_tests 2>&1 | tee sonuc.log
          kod=${PIPESTATUS[0]}

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### Linux (lavapipe)"
            echo ""
            echo "\`$ozet\`"
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          # Ubuntu'da lavapipe KURULU. Yani Vulkan yolunun atlanmasi bir cevre
          # sorunu degil, is akisinin kendi arizasidir: sessizce yesil gecmesin.
          # "Vulkan tukendi" haric: o loader/ICD yoklugu degil, ayni surecte cok
          # fazla cihaz acilmasi (kaynak tavani) — baska bir ariza sinifi.
          vulkan_atlama="$(grep -E 'ATLANDI:.*Vulkan' sonuc.log | grep -v 'tukendi' || true)"
          if [ -n "$vulkan_atlama" ]; then
            echo "$vulkan_atlama"
            echo "::error::Lavapipe kurulu oldugu halde Vulkan kapilari atlandi — loader/ICD gelmemis. 'passed' sayisi GPU yolu hakkinda hicbir sey soylemiyor."
            exit 1
          fi

          # Dogrulama katmani da KURULU (apt vulkan-validationlayers) ve yukarida
          # vulkaninfo ile loader duzeyinde LISTELENDIGI dogrulandi. Yani
          # "VK_LAYER_KHRONOS_validation yok" diyen bir atlama bir cevre gercegi
          # degil, is akisinin kendi arizasidir: basildiginda BES kapi
          # (rhi_validation_layer_reports_zero_errors + dort Mali kapisi) hic
          # kosmamis, dev.validation_errors()==0 iddiasi HIC OLCULMEMISTIR.
          # NOT: katman Arm kurallarini tanimayinca basilan
          # "dogrulama katmani Arm BestPractices kurallarini tanimiyor" atlamasi
          # BASKA bir siniftir (katman var, surumu eski) ve bu ifadeye UYMAZ.
          katman_atlama="$(grep -E 'ATLANDI:.*VK_LAYER_KHRONOS_validation' sonuc.log || true)"
          if [ -n "$katman_atlama" ]; then
            echo "$katman_atlama"
            echo "::error::vulkan-validationlayers kurulu ve vulkaninfo katmani listeliyor oldugu halde katman kapilari atlandi — dogrulama/Mali kapilari HIC KOSMADI. 'passed' sayisi API kullanimi hakkinda hicbir sey soylemiyor."
            exit 1
          fi

          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer VE onlarin actiklarinda okudugu
      # varliklar. Paketleme mantigi YAML'de DEGIL tools/package.sh icinde:
      # uc is de, insan da ayni betigi kosar (uc kopya uc ayri yere kayardi).
      #
      # Betik yalniz kopyalamiyor, sonunda TAMLIK KAPISI kosuyor: kodun
      # istedigi her goreli varlik yolu (liste kaynak agacindaki dizgilerden
      # TURETILIYOR, elle yazilmiyor) pakette duruyor mu? Eksik dosya isi
      # KIRMIZI yapar. Sebep olculdu: varliksiz paket, ikililer varligi
      # ENGINE_SOURCE_DIR (derleme zamani yol) altinda aradigi icin derleyen
      # makinenin kaynak agaci olmayan hicbir yerde acilmiyordu.
      #
      # Testler GECTIKTEN sonra kosuyor ki "yesil olmayan ikili" indirilebilir
      # olmasin.
      # Paket kokune SURUM.txt ("kaynak linux-x86_64": CI surumsuz derler) ve
      # DOSYALAR.txt da yazilir; manifest kapisi (tools/paket_manifest.py)
      # betigin --denetle adiminda PR'da da olcer. TULPAR_PAKET_PLATFORM:
      # ikilinin basligindan turetilen platform bu isin etiketiyle celisirse
      # KIRMIZI (release.yml'deki PLATFORM ile ayni deger).
      # TULPAR KOPRUSU UCTAN UCA (K197 + K303, 2026-10-02). Motor CI'i bugune
      # kadar .tpr KOSTURMUYORDU: kopru yalniz C++ tarafindan (test_bridge)
      # olculuyordu, oyunlarin kendisi ("[kapi]" satirlari) yerel bir kapiydi
      # — cunku motoru taniyan derleyici ters yamayla kuruluyordu ve her
      # derleyici degisikliginde kirilabilirdi. Artik motor TulparLang'e bir
      # YEREL EKLENTI: YAYINLANMIS `tulpar` (derleyici yeniden derlenmeden)
      # bu isin urettigi yapi/tulpar-ext paketiyle kosar. Olculen
      # (tools/tulpar_dogrula.sh --tam): duman, pozitif kontroller (eklentisiz
      # import duser; bildirimdeki bozuk sembol link hatasinda ADIYLA; bozuk
      # imza typecheck'te), 4 dil sondasi, engine_dalga / engine_aksiyon kapi
      # satirlari BAYT BAYT, engine_bridge.test.tpr, 6 ornek 60 kare.
      # Derleyici `releases/latest`: TulparLang'in yayinlanmis son surumu —
      # "kullanicinin kurdugu tulpar motoru calistiriyor mu" sorusunun ta
      # kendisi. clang + libssl-dev: tulpar'in AOT linki (clang++, -lssl).
      - name: Tulpar koprusu (yayinlanmis tulpar + eklenti paketi)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          # Indirme + SHA256SUMS dogrulamasi (+ ozet denetiminin pozitif
          # kontrolu) tek yerde: tools/tulpar_indir.sh — release.yml de onu
          # kosar. (Oncesi: bu ayak ozeti HIC dogrulamiyordu.)
          bash tools/tulpar_indir.sh "$RUNNER_TEMP/tulpar"
          bash tools/tulpar_dogrula.sh --tulpar "$RUNNER_TEMP/tulpar/tulpar" --tam

      # TULPAR + TULPAR_PAKET_KOSU=zorunlu: paket kapisi tulpar-ext/'i
      # PAKETLENMIS dizinden bir ornek oyunla kosturur (tools/package.sh
      # eklenti_sinamalari); tulpar bulunamazsa atlamaz, KIRMIZI olur.
      - name: Ciktilari topla
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          TULPAR_PAKET_PLATFORM: linux-x86_64
          TULPAR_PAKET_KOSU: zorunlu
        run: TULPAR="$RUNNER_TEMP/tulpar/tulpar" bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: motor-linux-x86_64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 (AppleClang + MoltenVK)
    needs: detect-docs-only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-docs-only.outputs.docs_only != 'true'

      # main'e squash-merge ile gelen commit'in PR'i zaten yesil kostu; ayni
      # agaci uc platformda yeniden derlemek bosa 15-25 dk. PR kosumunun
      # artefakti (dagitim/) indirilir ve asagidaki "Ciktilari yukle" adimi
      # onu aynen yeniden yukler; derleme/test/paketleme adimlari atlanir.
      # Arama basarisizsa sifirdan derlenir (en kotu durumda davranis eski).
      # DOGRULUGU main'in `strict` dal korumasina bagli (TulparLang
      # auto-merge.yml basligindaki zincir): dal main'i iceriyorsa squash
      # sonrasi main'in agaci PR'in agacina esittir.
      - name: PR artefaktini yeniden kullanmayi dene
        id: reuse
        if: needs.detect-docs-only.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTEFAKT: motor-macos-arm64
        run: |
          set -e
          pr_num=$(git log -1 --format='%s' | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          if [ -z "$pr_num" ]; then
            echo "Commit basliginda PR numarasi yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head_sha=$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ -z "$head_sha" ]; then
            echo "PR #$pr_num okunamadi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          run_id=$(gh run list --workflow='CI' --status=success --limit=30 \
                     --json databaseId,headSha \
                     --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" | head -1)
          if [ -z "$run_id" ]; then
            echo "PR #$pr_num head $head_sha icin yesil CI kosumu yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "PR #$pr_num kosumu $run_id artefakti ($ARTEFAKT) yeniden kullaniliyor"
          set +e
          rm -rf dagitim && mkdir -p dagitim
          if ! gh run download "$run_id" -n "$ARTEFAKT" -D dagitim; then
            echo "Artefakt indirilemedi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$(ls -A dagitim)" ]; then
            echo "Artefakt bos — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ls -la dagitim
          echo "reused=true" >> "$GITHUB_OUTPUT"

      # MoltenVK = Metal uzerinde Vulkan ICD'si. Motor loader'i LINK ZAMANINDA
      # degil dlopen ile ariyor, yani paket gelmezse butun GPU kapilari atlanir
      # ve "passed" sayisi GPU hakkinda hicbir sey soylemez. Bu yuzden kurulum
      # UYARI degil HATA: sessizce "atlandi"ya dusmesin.
      #
      # vulkan-loader = libvulkan.1.dylib (ICD mekanizmasi), molten-vk = ICD'nin
      # kendisi. Ikisi ayri: TulparLang'de ilk denemede yalniz molten-vk kuruldu
      # ve loader bulunamadi (3 kapi GORUNUR atlandi, 2026-09-14).
      - name: Bagimliliklar (MoltenVK dahil)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          brew list --versions cmake  >/dev/null 2>&1 || brew install cmake
          brew list --versions ninja  >/dev/null 2>&1 || brew install ninja
          brew list --versions ccache >/dev/null 2>&1 || brew install ccache
          # GLFW: motor onu dlopen ile acar ve PAKETE KONUR (tools/package.sh
          # kaynaktan turetir). Kurulu degilse paketleme adimi kirmizi doner —
          # v0.1.0'in Windows zip'i tam olarak bu kutuphanesiz yayinlanmisti.
          brew list --versions glfw   >/dev/null 2>&1 || brew install glfw
          brew list --versions vulkan-loader >/dev/null 2>&1 || brew install vulkan-loader
          brew list --versions molten-vk     >/dev/null 2>&1 || brew install molten-vk
          # Dogrulama katmani: MoltenVK uzerinde de API kullanimi 0 hata istenir.
          brew list --versions vulkan-validationlayers >/dev/null 2>&1 || brew install vulkan-validationlayers
          # vulkaninfo: katmanin LOADER'a gorunup gorunmedigini bagimsiz olarak
          # olcen tek arac (Linux ayagindaki kontrolun esi). Katman/ICD yolunu
          # "dosya duruyor" diye degil, loader gercekten listeliyor mu diye
          # sinamak icin sart; brew formulu onu :test bagimliligi olarak
          # tutuyor, yani kendiliginden GELMEZ.
          brew list --versions vulkan-tools >/dev/null 2>&1 || brew install vulkan-tools

      # Loader ICD'yi KENDILIGINDEN BULMAZ: yollari acikca vermezsen "Vulkan
      # cihazi yok" dersin ve sebebini goremezsin.
      #
      # YOL "share" DEGIL "etc" (olculdu 2026-09-20, molten-vk 1.4.2). Homebrew
      # formulunun son satiri:
      #     (prefix/"etc/vulkan").install "MoltenVK/icd" => "icd.d"
      # yani json <keg>/etc/vulkan/icd.d/ altinda. TulparLang'den devralinan
      # recete "share/vulkan/icd.d" diyordu ve O YOL HIC VAR OLMADI — orada
      # kurulum yumusak (uyari) oldugu icin is yesil kaliyor, VK_ICD_FILENAMES
      # olmayan bir dosyayi gosteriyor, loader hicbir ICD bulamiyor ve butun
      # GPU kapilari sessizce atlaniyordu. Olculen kanit, ayni koda ait
      # 2026-09-17 kosumu: macOS "397 passed, 0 failed, 36 atlandi" vs Linux
      # "... 7 atlandi" — 29 kapi fazladan atlanmis, is yine de YESIL.
      # Bu yuzden burada yol ARANIR ve bulunamazsa is KIRMIZI olur.
      - name: Vulkan ortami + surucu gercekten var mi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          MVK="$(brew --prefix molten-vk)"
          VVL="$(brew --prefix vulkan-validationlayers)"

          ICD=""
          for c in "$MVK/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$MVK/share/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix)/share/vulkan/icd.d/MoltenVK_icd.json"; do
            if [ -f "$c" ]; then ICD="$c"; break; fi
          done
          if [ -z "$ICD" ]; then
            echo "::error::MoltenVK ICD json'u hicbir bilinen yolda YOK — loader cihaz bulamaz, butun GPU kapilari atlanirdi."
            echo "keg icinde gercekte nerede:"
            find "$MVK" -name 'MoltenVK_icd.json' 2>/dev/null | head || true
            exit 1
          fi
          echo "ICD: $ICD"
          cat "$ICD"

          LAYERS="$VVL/share/vulkan/explicit_layer.d"
          [ -d "$LAYERS" ] || LAYERS="$(brew --prefix)/share/vulkan/explicit_layer.d"
          if [ ! -d "$LAYERS" ]; then
            echo "::error::Dogrulama katmani dizini YOK — BestPractices kapisi sessizce atlanirdi."
            exit 1
          fi
          echo "katmanlar: $LAYERS"

          {
            echo "VK_ICD_FILENAMES=$ICD"
            echo "VK_DRIVER_FILES=$ICD"
            echo "VK_LAYER_PATH=$LAYERS"
            echo "VK_ADD_LAYER_PATH=$LAYERS"
          } >> "$GITHUB_ENV"

          # Teshis: loader gercekten duruyor mu?
          ls -la "$(brew --prefix)/lib/libvulkan"* "$(brew --prefix)/lib/libMoltenVK"* 2>&1 | head -8 || true

          # KATMAN LOADER'A GORUNUYOR MU? Yukaridaki kontroller yalnizca
          # "dosya duruyor" diyor; katmani ZINCIRE sokan sey loader'dir ve
          # gordugunu ancak loader'a sorunca ogrenirsin. Bu adim GITHUB_ENV'e
          # yazdigimiz degiskenleri kendi surecinde de export ederek vulkaninfo
          # kosar (GITHUB_ENV yalnizca SONRAKI adimlari etkiler).
          #
          # Katman listelenmesi ICD'den bagimsizdir (manifest taramasi), yani bu
          # kontrol MoltenVK calismiyor diye yanlis kirmizi vermez.
          export VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD"
          export VK_LAYER_PATH="$LAYERS" VK_ADD_LAYER_PATH="$LAYERS"
          vulkaninfo --summary > vulkaninfo.log 2>&1 || true
          cat vulkaninfo.log || true
          # Iki ayri ariza, iki ayri mesaj. vulkaninfo instance kuramazsa katman
          # listesini HIC basmaz; o cikti ustunde "katman yok" demek teshisi
          # yanlis yere tasirdi. Onun kendi mesaji var ve o mesaj tam da
          # suphelendigimiz seyi olcuyor: loader, portability ICD'si uzerinden
          # instance kurabiliyor mu?
          if ! grep -q 'Instance Layers' vulkaninfo.log; then
            echo "::error::vulkaninfo katman listesini HIC basamadi — loader MoltenVK ICD'si uzerinden instance kuramiyor. Motor bu durumda rhi/device.cpp'deki sessiz yedekle MoltenVK'yi DOGRUDAN yukler; o surecte loader yoktur, katman zinciri de yoktur ve VK_LAYER_PATH'in hicbir anlami kalmaz."
            echo "loader teshisi:"
            VK_LOADER_DEBUG=all vulkaninfo --summary 2>&1 | tail -60 || true
            exit 1
          fi
          if ! grep -q 'VK_LAYER_KHRONOS_validation' vulkaninfo.log; then
            echo "::error::VK_LAYER_KHRONOS_validation loader'in katman listesinde YOK (VK_LAYER_PATH=$LAYERS verilmisken) — dogrulama/Mali kapilari olcmeden atlanirdi."
            echo "manifest gercekte nerede:"
            find "$VVL" -name 'VkLayer_khronos_validation.json' 2>/dev/null | head || true
            echo "loader teshisi:"
            VK_LOADER_DEBUG=all vulkaninfo --summary 2>&1 | tail -60 || true
            exit 1
          fi
          grep 'VK_LAYER_KHRONOS_validation' vulkaninfo.log

          # TESHIS (kapi degil): loader MoltenVK ICD'si uzerinden bir CIHAZ
          # gorebiliyor mu? Goremiyorsa motor rhi/device.cpp'deki SESSIZ yedege
          # dusup MoltenVK'yi DOGRUDAN yukluyor demektir — o surecte loader hic
          # yoktur, katmanlar bir loader mekanizmasi oldugu icin VK_LAYER_PATH'in
          # de hicbir anlami kalmaz. Asagidaki katman kapisi kirmizi yanarsa
          # once bu satira bak: "loader cihaz goruyor" + "katman atlandi"
          # birlesimi teshisi motor tarafina tasir.
          if grep -qE '^[[:space:]]*deviceName' vulkaninfo.log; then
            echo "loader ICD uzerinden cihaz GORUYOR (yedege dusulmemesi beklenir):"
            grep -E '^[[:space:]]*deviceName' vulkaninfo.log | head -4
          else
            echo "::warning::Loader MoltenVK ICD'si uzerinden HIC CIHAZ GORMUYOR. Motor dogrudan-MoltenVK yedegine duser; o surecte katman zinciri YOKTUR."
          fi

      - name: ccache onbellegi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-

      # derle.sh'in bagimlilik denetimini GERCEK brew uzerinde olcer.
      # Neden onemli: kutuphane arama kodu yerelde (pacman) dogru gorunup
      # baska bir dagitimda yanlis olcebiliyor — nitekim ilk surumu tam
      # oyle bir hatayla cikti (tek `ls`e cok yol verilince KURULU
      # kutuphaneler "eksik" gorunuyordu). --sadece-denetle kurmaz, derlemez.
      - name: derle.sh bagimlilik denetimi (brew)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          # Hangi bash kosuyor? mapfile duzeltmesi bash 3.2 icindi ve
          # surumu OLCMEDEN "3.2'de sinandi" demek olurdu.
          bash --version | head -1
          ./derle.sh --sadece-denetle

      - name: Katman denetimi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: cmake --build yapi -j"$(sysctl -n hw.ncpu)"

      - name: ccache isabet orani
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Kapinin POZITIF KONTROLU (Linux isindekinin esi, ayri platform ayri
      # cikti): Vulkan'i kapatip atlama satirlarinin GERCEKTEN basildigini
      # goruyoruz. Boylece asagidaki Vulkan kontrolunun hicbir seye uymayan
      # bos bir grep olmadigi burada da kanitlanmis oluyor.
      - name: Atlama mekanizmasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          TULPAR_ENGINE_NO_VULKAN=1 ./yapi/engine_tests rhi_ > kontrol.log 2>&1 || true
          n=$(grep -E 'ATLANDI:.*Vulkan' kontrol.log | grep -cv 'tukendi')
          if [ "$n" -eq 0 ]; then
            echo "::error::Pozitif kontrol basarisiz: TULPAR_ENGINE_NO_VULKAN=1 ile bile Vulkan atlama satiri basilmadi. Asagidaki Vulkan kapisi bos bir grep olurdu."
            tail -40 kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: $n atlama satiri uretildi."

      # IKINCI POZITIF KONTROL — bu sefer DOGRULAMA KATMANI kapisi icin.
      # Katmani BILEREK gizliyoruz (VK_LAYER_PATH + VK_ADD_LAYER_PATH bos bir
      # dizine; loader'a "explicit katmanlari yalniz burada ara" demektir) ve
      # bes kapinin atlama satirini GERCEKTEN bastigini goruyoruz. Boylece
      # asagidaki katman kapisinin hicbir seye uymayan bos bir grep olmadigi
      # kanitlanir. Iki suzgec besini de kapsar (ad ALT DIZGI ile eslenir):
      #   validation_layer  -> rhi_validation_layer_reports_zero_errors
      #   mali_best_practices -> renderer_/render_graph_post_/render_graph_gpu_cull_/temporal_
      - name: Dogrulama katmani atlamasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          # NOT: BSD mktemp (macOS) sablonsuz `mktemp -d` KABUL ETMEZ — bos bir
          # $bos, VK_LAYER_PATH="" demek olurdu ve kontrol sessizce anlamini
          # yitirirdi. Dizini kendimiz yaratiyoruz: her iki ayakta da ayni.
          bos="${RUNNER_TEMP:-$PWD}/bos_katman_dizini"
          rm -rf "$bos"; mkdir -p "$bos"
          VK_LAYER_PATH="$bos" VK_ADD_LAYER_PATH="$bos" ./yapi/engine_tests mali_best_practices  > katman_kontrol.log 2>&1 || true
          VK_LAYER_PATH="$bos" VK_ADD_LAYER_PATH="$bos" ./yapi/engine_tests validation_layer     >> katman_kontrol.log 2>&1 || true
          # Asagidaki kapiyla AYNI ifade — kontrol ettigi sey de tam olarak o.
          n=$(grep -cE 'ATLANDI:.*VK_LAYER_KHRONOS_validation' katman_kontrol.log || true)
          if [ "$n" -lt 5 ]; then
            echo "::error::Pozitif kontrol basarisiz: katman GIZLIYKEN beklenen 5 atlama satirindan yalnizca $n basildi. Asagidaki katman kapisi bos bir grep olurdu. (Kapi eklendi/silindiyse bu sayiyi guncelle.)"
            tail -60 katman_kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: katman gizliyken $n atlama satiri uretildi (bes kapi)."

      - name: Testler + kapi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          ./yapi/engine_tests 2>&1 | tee sonuc.log
          kod=${PIPESTATUS[0]}

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### macOS arm64 (MoltenVK)"
            echo ""
            echo "\`$ozet\`"
            echo ""
            echo "AArch64 fiber gecisi (core/jobs/fiber_switch_aarch64.S) YALNIZ burada kosuyor."
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          # MoltenVK KURULU (yukarida sert kapi). Yani Vulkan yolunun atlanmasi
          # bir cevre sorunu degil, is akisinin kendi arizasidir.
          vulkan_atlama="$(grep -E 'ATLANDI:.*Vulkan' sonuc.log | grep -v 'tukendi' || true)"
          if [ -n "$vulkan_atlama" ]; then
            echo "$vulkan_atlama"
            echo "::error::MoltenVK kurulu oldugu halde Vulkan kapilari atlandi — loader/ICD gelmemis. 'passed' sayisi GPU yolu hakkinda hicbir sey soylemiyor."
            exit 1
          fi

          # Dogrulama katmani da KURULU (apt vulkan-validationlayers) ve yukarida
          # vulkaninfo ile loader duzeyinde LISTELENDIGI dogrulandi. Yani
          # "VK_LAYER_KHRONOS_validation yok" diyen bir atlama bir cevre gercegi
          # degil, is akisinin kendi arizasidir: basildiginda BES kapi
          # (rhi_validation_layer_reports_zero_errors + dort Mali kapisi) hic
          # kosmamis, dev.validation_errors()==0 iddiasi HIC OLCULMEMISTIR.
          # NOT: katman Arm kurallarini tanimayinca basilan
          # "dogrulama katmani Arm BestPractices kurallarini tanimiyor" atlamasi
          # BASKA bir siniftir (katman var, surumu eski) ve bu ifadeye UYMAZ.
          # macOS'ta kapi SU ANDA ULASILAMAYAN bir sey istemiyor. Olculdu
          # (CI macOS 2026-09-20): loader MoltenVK ICD'si uzerinden instance
          # KURAMIYOR, motor da rhi/device.cpp'deki yedege dusup MoltenVK'yi
          # DOGRUDAN yukluyor. Katmanlar bir LOADER mekanizmasidir; o yol
          # secildiginde katman VAR OLAMAZ, VK_LAYER_PATH'in anlami kalmaz.
          #
          # Bu yuzden kapinin iddiasi "katman KOSMALI" degil:
          #   YA katman kosar, YA motor loader'i atladigini ACIKCA SOYLER.
          # Sessiz bozulma (ikisi de yok) yine KIRMIZI. Boylece kapi gercek bir
          # sey olcmeye devam eder ama bugun imkansiz olani talep etmez.
          katman_atlama="$(grep -E 'ATLANDI:.*VK_LAYER_KHRONOS_validation' sonuc.log || true)"
          loader_atlandi="$(grep -E 'loader ATLANDI|loader ATLANDI \(dogrudan MoltenVK\)' sonuc.log || true)"
          if [ -n "$katman_atlama" ] && [ -z "$loader_atlandi" ]; then
            echo "$katman_atlama"
            echo "::error::Katman kapilari atlandi ve motor SEBEBINI SOYLEMEDI. vulkan-validationlayers kurulu, VK_LAYER_PATH verilmis ve vulkaninfo katmani listeliyor. Iki ihtimal var ve ikisi de yazilmali: (1) loader atlandi -> rhi/vk_api.cpp'deki yedek '[rhi] loader ATLANDI' basmali; (2) baska bir sebep -> o sebep yazilmali. SESSIZ atlama kabul edilmiyor."
            exit 1
          fi
          if [ -n "$loader_atlandi" ]; then
            echo "$loader_atlandi"
            echo "::warning::Loader ATLANDI: MoltenVK dogrudan yuklendi, bu kosumda katman/BestPractices kapilari OLCULMEDI. Bu bilinen bir macOS durumu (rhi/device.cpp yedegi) ve motor bunu acikca bildiriyor — sessiz degil. Loader yolu duzelene kadar macOS'ta bu bes kapi GPU dogrulamasi hakkinda hicbir sey soylemez."
          fi

          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer VE onlarin actiklarinda okudugu
      # varliklar. Paketleme mantigi YAML'de DEGIL tools/package.sh icinde:
      # uc is de, insan da ayni betigi kosar (uc kopya uc ayri yere kayardi).
      #
      # Betik yalniz kopyalamiyor, sonunda TAMLIK KAPISI kosuyor: kodun
      # istedigi her goreli varlik yolu (liste kaynak agacindaki dizgilerden
      # TURETILIYOR, elle yazilmiyor) pakette duruyor mu? Eksik dosya isi
      # KIRMIZI yapar. Sebep olculdu: varliksiz paket, ikililer varligi
      # ENGINE_SOURCE_DIR (derleme zamani yol) altinda aradigi icin derleyen
      # makinenin kaynak agaci olmayan hicbir yerde acilmiyordu.
      #
      # Testler GECTIKTEN sonra kosuyor ki "yesil olmayan ikili" indirilebilir
      # olmasin.
      # TULPAR KOPRUSU, macOS (K197). Linux ayagindaki adimin esi: yayinlanmis
      # tulpar (universal) + bu isin yapi/tulpar-ext paketi. NEDEN AYRICA
      # macOS: bildirimin link.macos bolumu (group yok — Apple ld
      # --start-group tanimaz) CI'da hic sinanmamisti; AArch64'te Jolt FMA
      # birlesirse [kapi] satirlari x86_64'ten ayrisir (CMake -ffp-contract=off
      # PUBLIC bunu onlemek icin var — burada OLCULUYOR). Paravirtual GPU:
      # piksel kapilari atlanir, kapi satirlari GPU'dan bagimsiz (oyun mantigi).
      # Indirilenler SHA256SUMS.txt ile dogrulanir: yanlis/yarim bir ikiliyle
      # "kopru kirildi" sanilmasin.
      # Homebrew on kosulu YOK: v3.38.0 macOS ikilisi Homebrew llvm@18
      # libunwind'ine (ve sessizce openssl@3 + zstd dylib'lerine) bagliydi ve
      # bu adim gecici olarak `brew install llvm@18` yapiyordu. TulparLang #462
      # (v3.38.5, 2026-10-02) ikiliyi tasinabilir yapti ve kendi CI'inda
      # Homebrew LLVM gizlenmis ortamda koşturarak kilitledi
      # (tools/dinamik_bag_denetle.sh). Bu adim artik hicbir Homebrew paketi
      # kurmuyor: ikili bir gun yine Homebrew'a baglanirsa burada dyld
      # "Library not loaded" ile KIRMIZI olur.
      - name: Tulpar koprusu (yayinlanmis tulpar + eklenti paketi)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          # tools/tulpar_indir.sh: -macos-arm64 adlari (TulparLang v3.39.0).
          bash tools/tulpar_indir.sh "$RUNNER_TEMP/tulpar"
          bash tools/tulpar_dogrula.sh --tulpar "$RUNNER_TEMP/tulpar/tulpar" --tam

      # SURUM.txt + DOSYALAR.txt: bkz. Linux isindeki ayni adim.
      # TULPAR + TULPAR_PAKET_KOSU=zorunlu: bkz. Linux isindeki ayni adim.
      - name: Ciktilari topla
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          TULPAR_PAKET_PLATFORM: macos-arm64
          TULPAR_PAKET_KOSU: zorunlu
        run: TULPAR="$RUNNER_TEMP/tulpar/tulpar" bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: motor-macos-arm64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64 (MSYS2 MINGW64)
    needs: detect-docs-only
    runs-on: windows-latest
    # Olculdu 2026-10-05: uzun kapilar Linux/macOS'a birakilinca ~10 dk; 30 dk
    # bir kilitlenmenin isi saatlerce tutmasini onler.
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Satir sonlari .gitattributes ile LF'e sabitli (kanonik .sahne bayt-esitlik
      # kapisi bunu sart kosuyor); autocrlf'i ayrica kapatiyoruz ki runner ayari
      # .gitattributes'tan once devreye girmesin.
      - name: Satir sonu ayari
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        if: needs.detect-docs-only.outputs.docs_only != 'true'

      # main'e squash-merge ile gelen commit'in PR'i zaten yesil kostu; ayni
      # agaci uc platformda yeniden derlemek bosa 15-25 dk. PR kosumunun
      # artefakti (dagitim/) indirilir ve asagidaki "Ciktilari yukle" adimi
      # onu aynen yeniden yukler; derleme/test/paketleme adimlari atlanir.
      # Arama basarisizsa sifirdan derlenir (en kotu durumda davranis eski).
      # DOGRULUGU main'in `strict` dal korumasina bagli (TulparLang
      # auto-merge.yml basligindaki zincir): dal main'i iceriyorsa squash
      # sonrasi main'in agaci PR'in agacina esittir.
      - name: PR artefaktini yeniden kullanmayi dene
        id: reuse
        if: needs.detect-docs-only.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTEFAKT: motor-windows-x86_64
        run: |
          set -e
          pr_num=$(git log -1 --format='%s' | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          if [ -z "$pr_num" ]; then
            echo "Commit basliginda PR numarasi yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head_sha=$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ -z "$head_sha" ]; then
            echo "PR #$pr_num okunamadi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          run_id=$(gh run list --workflow='CI' --status=success --limit=30 \
                     --json databaseId,headSha \
                     --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" | head -1)
          if [ -z "$run_id" ]; then
            echo "PR #$pr_num head $head_sha icin yesil CI kosumu yok — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "PR #$pr_num kosumu $run_id artefakti ($ARTEFAKT) yeniden kullaniliyor"
          set +e
          rm -rf dagitim && mkdir -p dagitim
          if ! gh run download "$run_id" -n "$ARTEFAKT" -D dagitim; then
            echo "Artefakt indirilemedi — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$(ls -A dagitim)" ]; then
            echo "Artefakt bos — sifirdan derleniyor."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ls -la dagitim
          echo "reused=true" >> "$GITHUB_OUTPUT"

      # update: false — "Final system upgrade" adimi olculdu 27-31 sn ve TEMEL
      # IMAJI tazelemekten baska is yapmiyor; ihtiyac duydugumuz paketler zaten
      # `install:` ile geliyor. Paket onbellegi (setup-msys2'nin kendi cache'i,
      # ~168 MB, isabet ediyor) bundan bagimsiz calisiyor.
      - uses: msys2/setup-msys2@v2
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-vulkan-validation-layers

      # YAZILIM VULKAN ICD'si (SwiftShader) — Windows'ta da (2026-10-05).
      # Runner'da vulkan-1.dll (System32) var ama ICD yok: vkCreateInstance
      # VK_ERROR_INCOMPATIBLE_DRIVER ve bu yuzden butun GPU kapilari, Tulpar
      # oyunlarinin kare dongusu, [kapi] satirlari Windows'ta HIC olculmuyordu.
      # ICD: runner'daki Google Chrome'un vk_swiftshader.dll'i (Vulkan 1.3).
      # MSYS2 mesa lavapipe'i DENENDI ve ELENDI: bellek birakirken yigini
      # bozuyor (0xC0000374; motorsuz sonda ile kanitlandi, Tuzaklar 8cr).
      # Loader'a KAYIT DEFTERINDEN tanitilir (yonetici surec VK_DRIVER_FILES'i
      # yok sayar). Ayrinti + bagimsiz sondalar: tools/windows_vulkan_icd.sh.
      - name: Yazilim Vulkan ICD'si (SwiftShader) + dogrulama katmani gercekten var mi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: bash tools/windows_vulkan_icd.sh kur

      # Olculdu (2026-09-19): core.autocrlf=true olan bir makinede taze klon bu
      # dosyayi CRLF'e ceviriyor, yazici LF uretiyor ve kanonik kapi kodda hicbir
      # hata yokken kirmizi doniyordu. Kapinin kapisi.
      - name: Kanonik varliklar LF mi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: python3 -c "import sys; d=open('tests/assets/editor.sahne','rb').read(); sys.exit(0 if b'\r' not in d else 1)" || { echo "::error::tests/assets/editor.sahne CRLF ile cikarilmis; .gitattributes devreye girmemis."; exit 1; }

      - name: ccache onbellegi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      # derle.bat GERCEK cmd'de kosuyor mu? Yerelde yalniz Wine altinda
      # denenebildi ve Wine gercek cmd DEGIL: ornegin %cmdcmdline% orada bos
      # donuyor. Bu adim farki kapatir. --denetle hicbir sey kurmaz ve
      # DERLEMEZ; olctugu sey .bat -> bash gecisi (MSYSTEM/CHERE_INVOKING
      # cagridan ONCE ortamda mi) ve bagimlilik raporunun gercek Windows'ta
      # dogru cikmasi. Is zaten CI=1 oldugu icin hatada tus beklenmez.
      - name: derle.bat gercek cmd'de (yalniz denetim)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          # setup-msys2 MSYSTEM'i zaten ortama koyuyor; bos birakmazsak
          # derle.bat'in kendi `set MSYSTEM=MINGW64` satiri SINANMAZ (o
          # olmasa da is yururdu). Bos geciyoruz ki satir gercekten olculsun.
          MSYSTEM: ''
        run: derle.bat --denetle

      - name: Katman denetimi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: cmake --build yapi -j"$(nproc)"

      - name: ccache isabet orani
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Linux isindeki iki pozitif kontrolun Windows ayagi: SwiftShader artik
      # KURULU oldugu icin asagidaki "Vulkan / katman atlamasi = KIRMIZI"
      # kurali burada da gecerli; o kuralin bos bir grep olmadigi burada
      # gosterilir (ayni ifadeler).
      - name: Atlama mekanizmasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          TULPAR_ENGINE_NO_VULKAN=1 ./yapi/engine_tests.exe rhi_ 2>&1 | tr -d '\r' > kontrol.log || true
          n=$(grep -E 'ATLANDI:.*Vulkan' kontrol.log | grep -cv 'tukendi')
          if [ "$n" -eq 0 ]; then
            echo "::error::Pozitif kontrol basarisiz: TULPAR_ENGINE_NO_VULKAN=1 ile bile Vulkan atlama satiri basilmadi."
            tail -40 kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: $n atlama satiri uretildi."

      # Katman GIZLEME: yonetici surecte VK_LAYER_PATH yok sayildigi icin (bkz.
      # surucu adimi) Linux'taki "bos dizine yonlendir" yolu burada bir sey
      # gizlemez. Kayit girdisi kontrol suresince SILINIR ve trap ile geri
      # konur; geri konmazsa asagidaki test adimi katman kapilarini atlar ve
      # KIRMIZI olur (yani unutulan bir geri koyma da gorunur).
      - name: Dogrulama katmani atlamasinin pozitif kontrolu
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          trap 'bash tools/windows_vulkan_icd.sh katman-geri' EXIT
          bash tools/windows_vulkan_icd.sh katman-gizle || exit 1
          ./yapi/engine_tests.exe mali_best_practices 2>&1 | tr -d '\r' > katman_kontrol.log || true
          ./yapi/engine_tests.exe validation_layer 2>&1 | tr -d '\r' >> katman_kontrol.log || true
          n=$(grep -cE 'ATLANDI:.*VK_LAYER_KHRONOS_validation' katman_kontrol.log || true)
          if [ "$n" -lt 5 ]; then
            echo "::error::Pozitif kontrol basarisiz: katman GIZLIYKEN beklenen 5 atlama satirindan yalnizca $n basildi."
            tail -60 katman_kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: katman gizliyken $n atlama satiri uretildi (bes kapi)."
          bash tools/windows_vulkan_icd.sh katman-geri && trap - EXIT
          python3 tools/vk_sonda.py --katman VK_LAYER_KHRONOS_validation | tr -d '\r' | tail -1

      # SwiftShader KURULU: GPU kapilari Windows'ta da KOSAR
      # (2026-10-05'e kadar burada ICD yoktu ve hepsi atlaniyordu). Linux
      # isiyle ayni kural: "Vulkan ... yok" ya da "VK_LAYER_KHRONOS_validation
      # yok" gerekceli tek bir atlama isi KIRMIZI yapar. Sure is ozetine yazilir.
      # `set +e`: msys2 kabugu `bash -e` ile kosar; engine_tests sifirdan
      # farkli donunce (cokme) betik ozet teshisinden ONCE oluyordu ve log
      # bos kaliyordu (olculdu 2026-10-05: cikis 127, tek satir cikti yok).
      - name: Testler + kapi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set +e
          set -uo pipefail
          t0=$SECONDS
          ./yapi/engine_tests.exe 2>&1 | tr -d '\r' | tee sonuc.log
          kod=${PIPESTATUS[0]}
          sure=$((SECONDS - t0))

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### Windows (MSYS2 MINGW64, SwiftShader)"
            echo ""
            echo "\`$ozet\` — ${sure} s"
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          vulkan_atlama="$(grep -E 'ATLANDI:.*Vulkan' sonuc.log | grep -v 'tukendi' || true)"
          if [ -n "$vulkan_atlama" ]; then
            echo "$vulkan_atlama"
            echo "::error::SwiftShader kurulu (HKLM Khronos Vulkan Drivers) oldugu halde Vulkan kapilari atlandi — ICD gelmemis."
            exit 1
          fi
          katman_atlama="$(grep -E 'ATLANDI:.*VK_LAYER_KHRONOS_validation' sonuc.log || true)"
          if [ -n "$katman_atlama" ]; then
            echo "$katman_atlama"
            echo "::error::Dogrulama katmani kurulu ve vulkaninfo listeliyor oldugu halde katman kapilari atlandi."
            exit 1
          fi
          echo "engine_tests (Windows, SwiftShader): ${sure} s"

          exit "$kod"

      # TULPAR KOPRUSU — WINDOWS (link.windows, 2026-10-02). Linux isindeki
      # adimin Windows ayagi: YAYINLANMIS tulpar-windows-x64.zip (+ runtime
      # arsivi; ikisi de SHA256SUMS.txt ile dogrulanir) bu isin
      # yapi/tulpar-ext paketiyle motor oyunlarini derleyip linkler ve kosar.
      # tulpar.exe AOT linkini MSYS2'nin clang++'i ile yapar (-static,
      # -lssl -lcrypto: o yuzden clang + openssl paketleri yukarida).
      # --uzun-atla: dalga (2400) ve aksiyon (3200) kare kapilari Windows'ta
      # KOSMAZ, ATLANDI diye sayilir. Olculdu (2026-10-05, SwiftShader ~210
      # ms/kare): ikisi bu adimin 26 dakikasinin 24'u; ayni satirlar o gun
      # burada Linux'la bayt bayt ayni cikti ve her kosumda Linux/macOS'ta
      # olculuyor. Kalan: duman, pozitif kontroller, dil sondalari, GPU'suz
      # suite, kopru testi (27), 6 ornek x 60 kare.
      # SWIFTSHADER (2026-10-05): yukaridaki adim ICD'yi kayit defterine yazdi,
      # motor burada da KURULUR. --gpusuz-izinli KALKTI: Linux/macOS
      # ile ayni bayraksiz kosum — duman, pozitif kontroller, dil sondalari,
      # GPU'suz kopru suite'i, engine_dalga / engine_aksiyon [kapi] satirlari
      # Linux'takiyle BAYT BAYT ayni olmak zorunda, engine_bridge.test.tpr,
      # 6 ornek 60 kare. Kurulum duserse adim KIRMIZI (atlama yok).
      # (Oncesi: ICD yoktu, kare dongusu 9 kapida ATLANDI —
      # `19 gecti, 0 dustu, 9 atlandi`.)
      - name: Tulpar koprusu (yayinlanmis tulpar + eklenti paketi, SwiftShader)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          set -uo pipefail
          d="$(cygpath -u "$RUNNER_TEMP")/tulpar"
          bash tools/tulpar_indir.sh "$d" || exit 1
          clang++ --version | head -1

          bash tools/tulpar_dogrula.sh --tulpar "$d/tulpar.exe" --tam --uzun-atla 2>&1 | tee tulpar.log
          kod=${PIPESTATUS[0]}
          ozet="$(grep -E '^tulpar dogrulama: ' tulpar.log | tail -1 || true)"
          {
            echo "### Windows: Tulpar koprusu (link.windows)"
            echo ""
            echo "\`${ozet:-ozet satiri YOK}\`"
            echo ""
            echo '```'
            grep -E 'ATLANDI:|kurulum dustu|\[bilgi\]|\[kapi\]|link adiyla|HATA Vulkan|GPU:' tulpar.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ozet" ]; then
            echo "::error::tulpar_dogrula.sh ozet satiri basmadi — betik yarida kesilmis olabilir."
            exit 1
          fi
          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer, varliklar VE Windows'ta SART olan
      # DLL'ler. Hepsi tools/package.sh icinde (Linux/macOS isleriyle AYNI
      # betik): MinGW ile derlenen .exe, libstdc++-6 / libgcc_s_seh-1 /
      # libwinpthread-1 olmadan MSYS2 DISINDA acilmaz ("program baslatilamadi").
      # DLL listesi elle yazilmiyor, ikilinin ithalat tablosundan suzuluyor —
      # arac zinciri degisince kendiliginden guncelleniyor — ve "hic DLL
      # bulunamadi" hala isi KIRMIZI yapiyor. AYRI SINIF: dlopen'lanan
      # kutuphaneler (glfw3.dll) ithalat tablosunda GORUNMEZ; onlarin listesi
      # kaynaktaki `dl_open(...)` cagrilarindan turetiliyor (ayni betik).
      # Betigin tamlik kapisi ayrica kodun istedigi her varligin pakette
      # oldugunu dogruluyor.
      # PAKETLEME KAPISI PR'DA. Bu olcum onceden YALNIZ release.yml'de vardi:
      # PR'lar yesil kalirken surum kosumu dusuyor, hata ancak ETIKET atilinca
      # goruluyordu — v0.1.1 ve v0.1.2 tam bu yuzden dustu (biri yanlis
      # suzgecten, digeri eksik sistem-DLL listesinden). Artik ayni betik
      # (tools/paket_denetle.sh) hem burada hem surumde kosuyor: PR'da yesilse
      # surumde de yesildir.
      # SURUM.txt + DOSYALAR.txt: bkz. Linux isindeki "Ciktilari topla".
      - name: Paketle + yerlesim/DLL kapisi
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          TULPAR_PAKET_PLATFORM: windows-x86_64
          TULPAR_PAKET_KOSU: zorunlu
        run: |
          set -euo pipefail
          mkdir -p paket/deneme
          bash tools/package.sh yapi paket/deneme
          bash tools/paket_denetle.sh yapi paket/deneme

      # TULPAR_PAKET_KOSU=zorunlu: paket kapisi tulpar-ext/'i PAKETLENMIS
      # dizinden kosturur (tools/package.sh eklenti_sinamalari). SwiftShader
      # kurulu (yukarida), yani Linux/macOS ile ayni tam kosu: 60 kare, hata
      # 0, HUD fontu paketten. tulpar yoksa KIRMIZI. (release.yml'in Windows
      # isinde ICD kurulmuyor; orada gpusuz kip.)
      - name: Ciktilari topla (+ MinGW DLL'leri)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          TULPAR_PAKET_PLATFORM: windows-x86_64
          TULPAR_PAKET_KOSU: zorunlu
        run: bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: motor-windows-x86_64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14
