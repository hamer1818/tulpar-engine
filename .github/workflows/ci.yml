# ===========================================================================
# Tulpar Engine — CI
#
# Kural (projenin kendi kurali): KOSMAYAN KAPI YESIL DEGILDIR.
# engine_tests donanim/arac yoksa sessizce gecmez, "ATLANDI: <sebep>" basar ve
# ozet satirindaki sayaca girer. Bu yuzden is akisi ozet satirini PARSE eder:
#   - ozet satiri hic yoksa   -> KIRMIZI (cokme/asilma "0 failed" gibi okunamaz)
#   - kosan != kayitli        -> KIRMIZI (kayit tasmasi: test hic kosmamis olur)
#   - failed > 0              -> KIRMIZI
#   - atlanan kapilarin sebepleri is ozetine YAZILIR (gorunmeden kalmasin)
# Ubuntu'da lavapipe, macOS'ta MoltenVK kurulur, yani Vulkan yolunun gercekten
# kosmasi BEKLENIR: "Vulkan ... yok" gerekceli tek bir atlama bile isi kirmiziya
# cevirir. Windows runner'inda yazilim ICD'si yok; orada GPU kapilari BEKLENEN
# sekilde atlanir ve sebepleri is ozetine yazilir.
# `continue-on-error` YOK; hicbir adim yumusatilmaz.
#
# UC PLATFORM, IKI MIMARI: linux/windows x86_64, macos arm64. macOS ayagi bir
# "ayni seyi bir kez daha kosturma" degil — fiber gecisi MIMARIYE OZEL elle
# yazilmis assembly (core/jobs/fiber_switch_{x86_64,aarch64}.S) ve AArch64 dali
# yalniz burada kosuyor. O is olmadan is sisteminin yarisi CI'da olculmuyordu.
# ===========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Derleyici onbellegi (ccache) UC ISTE DE acik. Gerekce olculdu (2026-09-20):
# 402 derleme biriminin 202'si (%50,2) vendored ve HIC DEGISMIYOR — Jolt 133,
# astcenc 22, meshoptimizer 20, Recast/Detour 18, ImGui 7, cgltf/stb/miniaudio 2.
# Onbelleksizken her kosum bunlari sifirdan derliyordu. Onbellek is alani
# ICINDE tutuluyor (checkout'tan SONRA geri yukleniyor; checkout clean:true
# oldugu icin once yuklenirse silinirdi).
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPRESS: "1"
  # Derleyici ikilisinin ICERIGINE gore anahtarla: runner imaji gcc'yi ayni
  # surum numarasiyla degistirirse mtime tabanli kontrol yanlis isabet verirdi.
  CCACHE_COMPILERCHECK: content

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (GCC + lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mesa-vulkan-drivers = lavapipe ICD (yazilim Vulkan). libvulkan1 = loader;
      # motor onu link zamaninda degil dlopen ile ariyor, yani paket yoksa butun
      # GPU kapilari atlanir ve "passed" sayisi GPU hakkinda hicbir sey soylemez.
      - name: Bagimliliklar (lavapipe dahil)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ python3 ccache libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: ccache onbellegi
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Vulkan surucusu gercekten var mi
        run: vulkaninfo --summary

      # Katman kurali mekaniktir: ihlal = derleme hatasi (engine_core'un on kosulu).
      # Derlemeden once ayrica acikca kosuyoruz ki mesaj derleyici ciktisinda kaybolmasin.
      - name: Katman denetimi
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        run: cmake --build yapi -j"$(nproc)"

      # Isabet orani GORUNUR olsun: dusen bir oran "onbellek calisiyor sandim"
      # diye sessizce gecmesin (yavaslamanin sebebi burada okunur).
      - name: ccache isabet orani
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Kapinin POZITIF KONTROLU: Vulkan'i kapatip atlama satirlarinin GERCEKTEN
      # basildigini goruyoruz. Boylece asagidaki Vulkan kontrolunun hicbir seye
      # uymayan bos bir grep olmadigi kanitlanmis oluyor.
      - name: Atlama mekanizmasinin pozitif kontrolu
        run: |
          set -uo pipefail
          TULPAR_ENGINE_NO_VULKAN=1 ./yapi/engine_tests rhi_ > kontrol.log 2>&1 || true
          # Asagidaki kapiyla AYNI ifade — kontrol ettigi sey de tam olarak o.
          n=$(grep -E 'ATLANDI:.*Vulkan' kontrol.log | grep -cv 'tukendi')
          if [ "$n" -eq 0 ]; then
            echo "::error::Pozitif kontrol basarisiz: TULPAR_ENGINE_NO_VULKAN=1 ile bile Vulkan atlama satiri basilmadi. Asagidaki Vulkan kapisi bos bir grep olurdu."
            tail -40 kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: $n atlama satiri uretildi."

      - name: Testler + kapi
        run: |
          set -uo pipefail
          ./yapi/engine_tests 2>&1 | tee sonuc.log
          kod=${PIPESTATUS[0]}

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### Linux (lavapipe)"
            echo ""
            echo "\`$ozet\`"
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          # Ubuntu'da lavapipe KURULU. Yani Vulkan yolunun atlanmasi bir cevre
          # sorunu degil, is akisinin kendi arizasidir: sessizce yesil gecmesin.
          # "Vulkan tukendi" haric: o loader/ICD yoklugu degil, ayni surecte cok
          # fazla cihaz acilmasi (kaynak tavani) — baska bir ariza sinifi.
          vulkan_atlama="$(grep -E 'ATLANDI:.*Vulkan' sonuc.log | grep -v 'tukendi' || true)"
          if [ -n "$vulkan_atlama" ]; then
            echo "$vulkan_atlama"
            echo "::error::Lavapipe kurulu oldugu halde Vulkan kapilari atlandi — loader/ICD gelmemis. 'passed' sayisi GPU yolu hakkinda hicbir sey soylemiyor."
            exit 1
          fi

          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer VE onlarin actiklarinda okudugu
      # varliklar. Paketleme mantigi YAML'de DEGIL tools/package.sh icinde:
      # uc is de, insan da ayni betigi kosar (uc kopya uc ayri yere kayardi).
      #
      # Betik yalniz kopyalamiyor, sonunda TAMLIK KAPISI kosuyor: kodun
      # istedigi her goreli varlik yolu (liste kaynak agacindaki dizgilerden
      # TURETILIYOR, elle yazilmiyor) pakette duruyor mu? Eksik dosya isi
      # KIRMIZI yapar. Sebep olculdu: varliksiz paket, ikililer varligi
      # ENGINE_SOURCE_DIR (derleme zamani yol) altinda aradigi icin derleyen
      # makinenin kaynak agaci olmayan hicbir yerde acilmiyordu.
      #
      # Testler GECTIKTEN sonra kosuyor ki "yesil olmayan ikili" indirilebilir
      # olmasin.
      - name: Ciktilari topla
        run: bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: motor-linux-x86_64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 (AppleClang + MoltenVK)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # MoltenVK = Metal uzerinde Vulkan ICD'si. Motor loader'i LINK ZAMANINDA
      # degil dlopen ile ariyor, yani paket gelmezse butun GPU kapilari atlanir
      # ve "passed" sayisi GPU hakkinda hicbir sey soylemez. Bu yuzden kurulum
      # UYARI degil HATA: sessizce "atlandi"ya dusmesin.
      #
      # vulkan-loader = libvulkan.1.dylib (ICD mekanizmasi), molten-vk = ICD'nin
      # kendisi. Ikisi ayri: TulparLang'de ilk denemede yalniz molten-vk kuruldu
      # ve loader bulunamadi (3 kapi GORUNUR atlandi, 2026-09-14).
      - name: Bagimliliklar (MoltenVK dahil)
        run: |
          set -euo pipefail
          brew list --versions cmake  >/dev/null 2>&1 || brew install cmake
          brew list --versions ninja  >/dev/null 2>&1 || brew install ninja
          brew list --versions ccache >/dev/null 2>&1 || brew install ccache
          brew list --versions vulkan-loader >/dev/null 2>&1 || brew install vulkan-loader
          brew list --versions molten-vk     >/dev/null 2>&1 || brew install molten-vk
          # Dogrulama katmani: MoltenVK uzerinde de API kullanimi 0 hata istenir.
          brew list --versions vulkan-validationlayers >/dev/null 2>&1 || brew install vulkan-validationlayers

      # Loader ICD'yi KENDILIGINDEN BULMAZ: yollari acikca vermezsen "Vulkan
      # cihazi yok" dersin ve sebebini goremezsin.
      #
      # YOL "share" DEGIL "etc" (olculdu 2026-09-20, molten-vk 1.4.2). Homebrew
      # formulunun son satiri:
      #     (prefix/"etc/vulkan").install "MoltenVK/icd" => "icd.d"
      # yani json <keg>/etc/vulkan/icd.d/ altinda. TulparLang'den devralinan
      # recete "share/vulkan/icd.d" diyordu ve O YOL HIC VAR OLMADI — orada
      # kurulum yumusak (uyari) oldugu icin is yesil kaliyor, VK_ICD_FILENAMES
      # olmayan bir dosyayi gosteriyor, loader hicbir ICD bulamiyor ve butun
      # GPU kapilari sessizce atlaniyordu. Olculen kanit, ayni koda ait
      # 2026-09-17 kosumu: macOS "397 passed, 0 failed, 36 atlandi" vs Linux
      # "... 7 atlandi" — 29 kapi fazladan atlanmis, is yine de YESIL.
      # Bu yuzden burada yol ARANIR ve bulunamazsa is KIRMIZI olur.
      - name: Vulkan ortami + surucu gercekten var mi
        run: |
          set -euo pipefail
          MVK="$(brew --prefix molten-vk)"
          VVL="$(brew --prefix vulkan-validationlayers)"

          ICD=""
          for c in "$MVK/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$MVK/share/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix)/share/vulkan/icd.d/MoltenVK_icd.json"; do
            if [ -f "$c" ]; then ICD="$c"; break; fi
          done
          if [ -z "$ICD" ]; then
            echo "::error::MoltenVK ICD json'u hicbir bilinen yolda YOK — loader cihaz bulamaz, butun GPU kapilari atlanirdi."
            echo "keg icinde gercekte nerede:"
            find "$MVK" -name 'MoltenVK_icd.json' 2>/dev/null | head || true
            exit 1
          fi
          echo "ICD: $ICD"
          cat "$ICD"

          LAYERS="$VVL/share/vulkan/explicit_layer.d"
          [ -d "$LAYERS" ] || LAYERS="$(brew --prefix)/share/vulkan/explicit_layer.d"
          if [ ! -d "$LAYERS" ]; then
            echo "::error::Dogrulama katmani dizini YOK — BestPractices kapisi sessizce atlanirdi."
            exit 1
          fi
          echo "katmanlar: $LAYERS"

          {
            echo "VK_ICD_FILENAMES=$ICD"
            echo "VK_DRIVER_FILES=$ICD"
            echo "VK_LAYER_PATH=$LAYERS"
            echo "VK_ADD_LAYER_PATH=$LAYERS"
          } >> "$GITHUB_ENV"

          # Teshis: loader gercekten duruyor mu?
          ls -la "$(brew --prefix)/lib/libvulkan"* "$(brew --prefix)/lib/libMoltenVK"* 2>&1 | head -8 || true

      - name: ccache onbellegi
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-

      - name: Katman denetimi
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        run: cmake --build yapi -j"$(sysctl -n hw.ncpu)"

      - name: ccache isabet orani
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Kapinin POZITIF KONTROLU (Linux isindekinin esi, ayri platform ayri
      # cikti): Vulkan'i kapatip atlama satirlarinin GERCEKTEN basildigini
      # goruyoruz. Boylece asagidaki Vulkan kontrolunun hicbir seye uymayan
      # bos bir grep olmadigi burada da kanitlanmis oluyor.
      - name: Atlama mekanizmasinin pozitif kontrolu
        run: |
          set -uo pipefail
          TULPAR_ENGINE_NO_VULKAN=1 ./yapi/engine_tests rhi_ > kontrol.log 2>&1 || true
          n=$(grep -E 'ATLANDI:.*Vulkan' kontrol.log | grep -cv 'tukendi')
          if [ "$n" -eq 0 ]; then
            echo "::error::Pozitif kontrol basarisiz: TULPAR_ENGINE_NO_VULKAN=1 ile bile Vulkan atlama satiri basilmadi. Asagidaki Vulkan kapisi bos bir grep olurdu."
            tail -40 kontrol.log
            exit 1
          fi
          echo "Pozitif kontrol tamam: $n atlama satiri uretildi."

      - name: Testler + kapi
        run: |
          set -uo pipefail
          ./yapi/engine_tests 2>&1 | tee sonuc.log
          kod=${PIPESTATUS[0]}

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### macOS arm64 (MoltenVK)"
            echo ""
            echo "\`$ozet\`"
            echo ""
            echo "AArch64 fiber gecisi (core/jobs/fiber_switch_aarch64.S) YALNIZ burada kosuyor."
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          # MoltenVK KURULU (yukarida sert kapi). Yani Vulkan yolunun atlanmasi
          # bir cevre sorunu degil, is akisinin kendi arizasidir.
          vulkan_atlama="$(grep -E 'ATLANDI:.*Vulkan' sonuc.log | grep -v 'tukendi' || true)"
          if [ -n "$vulkan_atlama" ]; then
            echo "$vulkan_atlama"
            echo "::error::MoltenVK kurulu oldugu halde Vulkan kapilari atlandi — loader/ICD gelmemis. 'passed' sayisi GPU yolu hakkinda hicbir sey soylemiyor."
            exit 1
          fi

          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer VE onlarin actiklarinda okudugu
      # varliklar. Paketleme mantigi YAML'de DEGIL tools/package.sh icinde:
      # uc is de, insan da ayni betigi kosar (uc kopya uc ayri yere kayardi).
      #
      # Betik yalniz kopyalamiyor, sonunda TAMLIK KAPISI kosuyor: kodun
      # istedigi her goreli varlik yolu (liste kaynak agacindaki dizgilerden
      # TURETILIYOR, elle yazilmiyor) pakette duruyor mu? Eksik dosya isi
      # KIRMIZI yapar. Sebep olculdu: varliksiz paket, ikililer varligi
      # ENGINE_SOURCE_DIR (derleme zamani yol) altinda aradigi icin derleyen
      # makinenin kaynak agaci olmayan hicbir yerde acilmiyordu.
      #
      # Testler GECTIKTEN sonra kosuyor ki "yesil olmayan ikili" indirilebilir
      # olmasin.
      - name: Ciktilari topla
        run: bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: motor-macos-arm64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64 (MSYS2 MINGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Satir sonlari .gitattributes ile LF'e sabitli (kanonik .sahne bayt-esitlik
      # kapisi bunu sart kosuyor); autocrlf'i ayrica kapatiyoruz ki runner ayari
      # .gitattributes'tan once devreye girmesin.
      - name: Satir sonu ayari
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      # update: false — "Final system upgrade" adimi olculdu 27-31 sn ve TEMEL
      # IMAJI tazelemekten baska is yapmiyor; ihtiyac duydugumuz paketler zaten
      # `install:` ile geliyor. Paket onbellegi (setup-msys2'nin kendi cache'i,
      # ~168 MB, isabet ediyor) bundan bagimsiz calisiyor.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ccache

      # Olculdu (2026-09-19): core.autocrlf=true olan bir makinede taze klon bu
      # dosyayi CRLF'e ceviriyor, yazici LF uretiyor ve kanonik kapi kodda hicbir
      # hata yokken kirmizi doniyordu. Kapinin kapisi.
      - name: Kanonik varliklar LF mi
        run: python3 -c "import sys; d=open('tests/assets/editor.sahne','rb').read(); sys.exit(0 if b'\r' not in d else 1)" || { echo "::error::tests/assets/editor.sahne CRLF ile cikarilmis; .gitattributes devreye girmemis."; exit 1; }

      - name: ccache onbellegi
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      - name: Katman denetimi
        run: python3 tools/layer_check.py .

      - name: Yapilandir
        run: |
          ccache --zero-stats
          cmake -S . -B yapi -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Derle
        run: cmake --build yapi -j"$(nproc)"

      - name: ccache isabet orani
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      # Windows runner'inda yazilim Vulkan ICD'si yok; RHI kapilari burada
      # ATLANDI olacak ve bu BEKLENEN durum. Ama gorunmez kalmasin: sebepler
      # is ozetine yazilir. Gercek Vulkan kapisi Linux isinde.
      - name: Testler + kapi
        run: |
          set -uo pipefail
          ./yapi/engine_tests.exe 2>&1 | tee sonuc.log
          kod=${PIPESTATUS[0]}

          ozet="$(grep -E '^engine tests: [0-9]+ passed' sonuc.log | tail -1 || true)"
          if [ -z "$ozet" ]; then
            echo "::error::Ozet satiri YOK — engine_tests cokmus ya da asilmis olabilir."
            exit 1
          fi
          echo "$ozet"

          gecen=$(sed -E 's/^engine tests: ([0-9]+) passed.*/\1/'   <<< "$ozet")
          kalan=$(sed -E 's/.*, ([0-9]+) failed.*/\1/'              <<< "$ozet")
          atlanan=$(sed -E 's/.*, ([0-9]+) atlandi.*/\1/'           <<< "$ozet")
          kosan=$(sed -E 's/.*\(([0-9]+)\/[0-9]+ kosuldu\).*/\1/'   <<< "$ozet")
          kayitli=$(sed -E 's/.*\([0-9]+\/([0-9]+) kosuldu\).*/\1/' <<< "$ozet")

          {
            echo "### Windows (MSYS2 MINGW64)"
            echo ""
            echo "\`$ozet\`"
            echo ""
            echo "Vulkan ICD'si yok: GPU kapilari burada atlanir, olculdukleri yer Linux isi."
            echo ""
            if [ "$atlanan" -gt 0 ]; then
              echo "<details><summary>Atlanan $atlanan kapi</summary>"
              echo ""
              echo '```'
              grep -E 'ATLANDI:' sonuc.log | sort | uniq -c | sort -rn
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'KAYIT TASMASI' sonuc.log; then
            echo "::error::Kayit tasmasi: bazi testler HIC kosmadi (tests/test.hpp icindeki Registry::kMax)."
            exit 1
          fi
          if [ "$kosan" != "$kayitli" ]; then
            echo "::error::Kayitli $kayitli testin yalnizca $kosan tanesi kosmus."
            exit 1
          fi
          if [ "$kalan" != "0" ] || [ "$gecen" -le 0 ]; then
            echo "::error::$kalan test kirmizi."
            exit 1
          fi

          exit "$kod"

      # CALISTIRILABILIR CIKTILAR — ikililer, varliklar VE Windows'ta SART olan
      # DLL'ler. Hepsi tools/package.sh icinde (Linux/macOS isleriyle AYNI
      # betik): MinGW ile derlenen .exe, libstdc++-6 / libgcc_s_seh-1 /
      # libwinpthread-1 olmadan MSYS2 DISINDA acilmaz ("program baslatilamadi").
      # DLL listesi elle yazilmiyor, ldd ciktisindan suzuluyor — arac zinciri
      # degisince kendiliginden guncelleniyor — ve "hic DLL bulunamadi" hala
      # isi KIRMIZI yapiyor. Betigin tamlik kapisi ayrica kodun istedigi her
      # varligin pakette oldugunu dogruluyor.
      - name: Ciktilari topla (+ MinGW DLL'leri)
        run: bash tools/package.sh yapi dagitim

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: motor-windows-x86_64
          path: dagitim/
          if-no-files-found: error
          retention-days: 14
